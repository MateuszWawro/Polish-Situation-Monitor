[project]
name = "psm-db"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic==1.20.0", "psycopg[binary]==3.3.6", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "mypy==2.4.0", "pytest==9.1.1"]

[tool.setuptools]
py-modules = ["import_prg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
