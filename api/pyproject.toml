[project]
name = "psm-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.143.2", "uvicorn==0.54.0", "sqlalchemy==2.1.4", "psycopg[binary]==3.3.6", "redis==8.1.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "mypy==2.4.0", "pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
